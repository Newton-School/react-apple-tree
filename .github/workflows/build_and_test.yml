name: Build and Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

jobs:
  check-base-branch:
    name: Check Base Branch
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check base branch
        if: contains(github.event.pull_request.base.ref, 'gh-pages') || contains(github.event.pull_request.base.ref, 'release')
        run: exit 1
      - name: Comment on PR
        if: contains(github.event.pull_request.base.ref, 'gh-pages') || contains(github.event.pull_request.base.ref, 'release')
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'The base branch name must not contain "gh-pages" or "release".'
            })

  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [check-base-branch]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test

  build-storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Setup git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY
      - name: Fetch master branch
        run: |
          git fetch origin
          git checkout master
      - name: Install dependencies
        run: npm ci
      - name: Build storybook docs
        run: npm run build-storybook
      - name: Copy docs to temporary location
        run: cp -r docs/main /tmp/rat_docs
      - name: Checkout gh-pages branch
        run: git checkout gh-pages
      - name: Copy docs back to the repository
        run: |
          rm -rf docs/main
          cp -r /tmp/rat_docs docs/main
      - name: Commit and push changes
        run: |
          git add docs/main -f
          git commit --allow-empty -m "[BOT] Build Storybook"
          git push origin gh-pages
