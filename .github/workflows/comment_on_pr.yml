name: Comment on Failed PR

on:
  workflow_run:
    workflows: ['Check Library Version Update']
    types:
      - completed

permissions:
  actions: read
  pull-requests: write
  contents: read

jobs:
  comment-on-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Retrieve PR Number Artifact
        uses: actions/download-artifact@v4
        with:
          name: pr-number
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Post PR Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const prNumber = fs.readFileSync('pr-number.txt', 'utf8').trim();

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(prNumber),
              body: `❌ Library version or versions.json update workflow failed. Please review and update accordingly.

Workflow Details:
  - Workflow: Check Library Version Update
  - Conclusion: Failure
  - Run URL: ${context.payload.workflow_run.html_url}`
      });
