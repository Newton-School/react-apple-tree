name: Comment on Failed PR

on:
  workflow_run:
    workflows: ['Check Library Version Update']
    types:
      - completed

jobs:
  comment-on-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Download PR Number
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const prArtifact = artifacts.data.artifacts.find(artifact => artifact.name === 'pr-number');

            if (prArtifact) {
              const download = await github.rest.actions.downloadWorkflowRunArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: prArtifact.id,
              });
              const prNumber = Buffer.from(download.data).toString('utf-8').trim();
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `❌ Library version or versions.json update workflow failed. Please review and update accordingly.

Workflow Details:
  - Workflow: Check Library Version Update
  - Conclusion: Failure
  - Run URL: ${context.payload.workflow_run.html_url}`
      });
      }
